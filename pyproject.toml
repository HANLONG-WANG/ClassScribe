[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "classscribe-core"
version = "0.1.0"
description = "Local-first classroom transcription orchestration for ClassScribe"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "LicenseRef-ClassScribe-NOASSERTION" }
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "msgspec>=0.19,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
  "classscribe-protocol>=0.1.0",
]

[project.scripts]
classscribe-core = "classscribe.cli:main"
classscribe-doctor = "classscribe.doctor:main"

[dependency-groups]
dev = [
  "coverage>=7.10,<8",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/classscribe"]

[tool.uv.sources]
classscribe-protocol = { path = "protocol/python", editable = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests", "protocol/contract_tests"]
markers = [
  "real_model: requires an explicitly installed pinned local neural model",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/classscribe/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/contracts/test_stage0_product_contract.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/classscribe", "protocol/python", "ibus", "scripts", "tests"]
exclude = [
  "backend/classscribe/db/migrations/versions",
  "tests/audio_fixtures",
  "tests/golden",
]
mypy_path = ["backend", "protocol/python"]

[tool.coverage.run]
branch = true
source = ["classscribe", "classscribe_protocol"]

[tool.coverage.report]
show_missing = true
fail_under = 80
