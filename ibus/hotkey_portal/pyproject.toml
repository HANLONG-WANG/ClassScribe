[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "classscribe-hotkey-portal"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["classscribe-protocol>=0.1.0"]

[project.scripts]
classscribe-hotkey-portal = "classscribe_hotkey_portal.main:main"

[tool.hatch.build.targets.wheel]
packages = ["classscribe_hotkey_portal"]

[tool.uv.sources]
classscribe-protocol = { path = "../../protocol/python", editable = true }

[tool.pyright]
venvPath = "."
venv = ".venv"
