[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "classscribe-worker-moss-td"
version = "0.1.0"
description = "MOSS-Transcribe-Diarize structural transcription adapter"
requires-python = ">=3.12,<3.13"
dependencies = [
  "classscribe-protocol>=0.1.0",
  "moss-transcribe-diarize[torch-runtime] @ git+https://github.com/OpenMOSS/MOSS-Transcribe-Diarize.git@61bc29cd4120be7b5d3b761b64cd5dff57263642",
]

[tool.uv.sources]
classscribe-protocol = { path = "../../protocol/python", editable = true }

[tool.uv]
package = false

[tool.pyright]
venvPath = "."
venv = ".venv"
