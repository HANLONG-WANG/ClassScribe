[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "classscribe-worker-nemotron"
version = "0.1.0"
description = "Nemotron speech adapter"
requires-python = ">=3.12,<3.13"
dependencies = [
  "classscribe-protocol>=0.1.0",
  "nemo-toolkit[asr]==3.1.0",
  "torch>=2.7,<3",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
package = false

[tool.uv.sources]
classscribe-protocol = { path = "../../protocol/python", editable = true }
nemo-toolkit = { git = "https://github.com/NVIDIA/NeMo.git", rev = "c9040511b2dbefe64767d9b8853b3a20d63a2cd2" }
