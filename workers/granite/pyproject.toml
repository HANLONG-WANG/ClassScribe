[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "classscribe-worker-granite"
version = "0.1.0"
description = "Granite Speech adapter"
requires-python = ">=3.12,<3.13"
dependencies = [
  "classscribe-protocol>=0.1.0",
  "librosa>=0.11,<0.12",
  "soundfile>=0.13,<0.14",
  "torch>=2.7,<3",
  "torchaudio==2.11.0",
  "transformers==4.57.6",
]

[tool.uv.sources]
classscribe-protocol = { path = "../../protocol/python", editable = true }

[tool.uv]
package = false

[tool.pyright]
venvPath = "."
venv = ".venv"
