name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/check_architecture.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Type-check isolated worker launch boundaries
        run: |
          for project in workers/*; do
            (cd "$project" && ../../.venv/bin/mypy --strict worker.py adapter.py healthcheck.py)
          done
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Verify isolated process locks
        run: |
          for project in protocol/python ibus/engine ibus/dictationd ibus/hotkey_portal workers/*; do
            uv lock --check --project "$project"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend check
